<svg
  xmlns="http://www.w3.org/2000/svg"
  width="20"
  height="20"
  viewBox="0 0 24 24"
  fill="none"
>
  <!-- timeline -->
  <line
    x1="3" y1="4" x2="3" y2="20"
    stroke="#94A3B8"
    stroke-width="2"
    stroke-linecap="round"
  />
  <line
    x1="3" y1="8" x2="21" y2="8"
    stroke="#CBD5E1"
    stroke-width="2"
    stroke-linecap="round"
  />
  <line
    x1="3" y1="14" x2="21" y2="14"
    stroke="#CBD5E1"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- gantt bars -->
  <rect
    x="6" y="6" width="8" height="4" rx="1"
    fill="#3B82F6"
  />
  <rect
    x="10" y="12" width="7" height="4" rx="1"
    fill="#22C55E"
  />
</svg>
